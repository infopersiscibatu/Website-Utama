name: Impor kode dari Mythex

on:
  workflow_dispatch:
    inputs:
      sumber:
        description: Alamat arsip kode (.tar.gz)
        required: true
        type: string

permissions:
  contents: write

jobs:
  impor:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Unduh dan pasang kode
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "${{ inputs.sumber }}" -o /tmp/kode.tar.gz
          mkdir -p /tmp/kode
          tar -xzf /tmp/kode.tar.gz -C /tmp/kode
          rsync -a --exclude '.git' --exclude '.github' /tmp/kode/ "$GITHUB_WORKSPACE/"
          git -C "$GITHUB_WORKSPACE" config user.name "Mythex Agent"
          git -C "$GITHUB_WORKSPACE" config user.email "agent@mythex.app"
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "Impor kode situs PC Persis Cibatu dari Mythex" || echo "tidak ada perubahan"
          git -C "$GITHUB_WORKSPACE" push
          echo "jumlah berkas:"
          git -C "$GITHUB_WORKSPACE" ls-files | wc -l

      - name: Rapikan berkas impor sekali pakai
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" rm -q .github/workflows/impor-kode.yml
          git -C "$GITHUB_WORKSPACE" commit -m "Impor selesai: hapus berkas impor sekali pakai"
          git -C "$GITHUB_WORKSPACE" push
